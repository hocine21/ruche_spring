name: Build & Test Spring

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image (with tests)
        run: docker build .

      - name: Run Container
        run: docker run -d -p 8080:8080 my-app