spring.application.name=ruche_connect
server.port=8080

# application.properties
firebase.credentials.path=${GOOGLE_APPLICATION_CREDENTIALS}

# Configuration des logs
logging.level.com.ruche.ruche_connect=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# Configuration pour afficher les erreurs d\u00c3\u00a9taill\u00c3\u00a9es en d\u00c3\u00a9veloppement
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Configuration du timeout pour RestTemplate
spring.mvc.async.request-timeout=30000

# Configuration des sessions - R\u00c3\u0089SOLUTION DU PROBL\u00c3\u0088ME
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=true

spring.mvc.log-request-details=true
