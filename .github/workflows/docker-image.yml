name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK pour Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Compilation Maven + affichage logs détaillés
      - name: Build with Maven (debug)
        run: |
          echo "🔧 Lancement du build Maven..."
          mvn -v
          mvn clean package -DskipTests -X
          echo "📂 Contenu du dossier target :"
          ls -l target || echo "⚠️ Aucun dossier target trouvé !"

      # 4️⃣ Vérification que le JAR existe
      - name: Check JAR exists
        run: |
          if ls target/*.jar 1> /dev/null 2>&1; then
            echo "✅ JAR trouvé, on continue..."
          else
            echo "❌ Aucun JAR généré, arrêt du workflow."
            exit 1
          fi

      # 5️⃣ Setup Docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6️⃣ Connexion Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ Build et push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ruche-spring:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ruche-spring:${{ github.sha }}
