<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestion des Alertes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .alerte-active { color: green; font-weight: bold; }
        .alerte-inactive { color: red; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { padding: 8px 12px; margin-right: 10px; }
    </style>
</head>
<body>

<h1>Gestion des Alertes Ruche</h1>

<p>
    Alertes actuellement : 
    <span th:if="${alertesActives}" class="alerte-active">Activées</span>
    <span th:if="${!alertesActives}" class="alerte-inactive">Désactivées</span>
</p>

<form th:action="@{/alertes/verifier}" method="get" style="display:inline-block;">
    <button type="submit" th:disabled="${!alertesActives}">Vérifier les alertes maintenant</button>
</form>

<form th:if="${alertesActives}" th:action="@{/alertes/desactiver}" method="post" style="display:inline-block;">
    <button type="submit">Désactiver les alertes</button>
</form>

<form th:if="${!alertesActives}" th:action="@{/alertes/activer}" method="post" style="display:inline-block;">
    <button type="submit">Activer les alertes</button>
</form>

<div th:if="${message}">
    <p><em th:text="${message}"></em></p>
</div>

<div th:if="${mesuresAlertes != null and !mesuresAlertes.isEmpty()}">
    <h2>Mesures déclenchant une alerte :</h2>
    <table>
        <thead>
            <tr>
                <th>Référence Capteur</th>
                <th>Température</th>
                <th>Humidité</th>
                <th>État Couvercle</th>
                <th>Horodatage</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="mesure : ${mesuresAlertes}">
                <td th:text="${mesure.refCapteur}">REF_CAPTEUR</td>
                <td th:text="${mesure.temperature}">Temp</td>
                <td th:text="${mesure.humidite}">Hum</td>
                <td th:text="${mesure.etatCouvercle}">Couvercle</td>
                <td th:text="${mesure.horodatage}">Horodatage</td>
            </tr>
        </tbody>
    </table>
</div>

<div th:if="${mesuresAlertes == null or mesuresAlertes.isEmpty()}">
    <p>Aucune alerte détectée pour le moment.</p>
</div>

</body>
</html>
