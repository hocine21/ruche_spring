<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Apiculteurs</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/apiculteurs.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
</head>
<body>
<div class="admin-container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img th:src="@{/images/ChatGPT Image 11 mai 2025, 22_42_25.png}" alt="Logo RucheConnect" class="logo">
            <h2>RucheConnect</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a th:href="@{/admin}"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a></li>
                <li><a th:href="@{/ruchers}"><i class="fa-solid fa-house-chimney"></i><span>Ruchers</span></a></li>
                <li><a th:href="@{/ruches}"><i class="fa-solid fa-bee"></i><span>Ruches</span></a></li>
                <li><a th:href="@{/mesures}"><i class="fa-solid fa-chart-line"></i><span>Mesures</span></a></li>
                <li><a th:href="@{/apiculteurs}" class="active"><i class="fa-solid fa-users"></i><span>Apiculteurs</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/logout}" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a>
        </div>
    </aside>

    <!-- Contenu principal -->
    <main class="main-content">
        <div class="section-header">
            <h2>Gestion des Apiculteurs</h2>
        </div>

        <!-- Formulaire d'ajout d'un apiculteur (en haut) -->
        <div class="table-container" style="max-width:500px; margin:0 auto 40px auto;">
            <h3 style="margin-bottom:18px;">Ajouter un Apiculteur</h3>
            <form th:action="@{/apiculteurs/create}" method="post" id="beekeeperForm">
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required />
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" required />
                </div>
                <div class="form-group">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required />
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required />
                </div>
                <div class="form-group">
                    <label for="role">Rôle :</label>
                    <select id="role" name="role" required>
                        <option value="Apiculteur" selected>Apiculteur</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="form-actions" style="text-align:right;">
                    <button type="submit" class="submit-btn">
                        <i class="fa-solid fa-plus"></i> Créer le compte
                    </button>
                </div>
                <p th:if="${error}" th:text="${error}" style="color:var(--error-color);"></p>
            </form>
        </div>

        <!-- Liste des apiculteurs (tableau simple en bas) -->
        <div class="table-container">
            <h3 style="margin-bottom:18px;">Liste des Apiculteurs</h3>
            <table class="simple-table">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="apiculteur : ${apiculteurs}">
                        <td th:text="${apiculteur.nom}"></td>
                        <td th:text="${apiculteur.prenom}"></td>
                        <td th:text="${apiculteur.email}"></td>
                        <td th:text="${apiculteur.role}"></td>
                        <td>
                            <form th:action="@{/apiculteurs/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${apiculteur.id}">
                                <button type="submit" class="btn-delete" title="Supprimer">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
